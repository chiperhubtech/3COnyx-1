version: 2

updates:
  # ── pnpm workspace (all packages) ─────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Group all patch updates together to reduce PR noise
      patch-updates:
        patterns: ["*"]
        update-types: ["patch"]
      # Group minor updates by ecosystem
      minor-security:
        patterns: ["express*", "helmet*", "cors*", "cookie-parser*", "pino*"]
        update-types: ["minor", "patch"]
      minor-ai:
        patterns: ["@anthropic-ai/*", "openai*", "@google/*", "gemini*"]
        update-types: ["minor", "patch"]
    ignore:
      # Never auto-bump major versions — require manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions workflows ───────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "ci"
      - "automated"
