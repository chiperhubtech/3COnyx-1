kind = "web"
previewPath = "/"
title = "3C Onyx"
version = "1.0.0"
id = "artifacts/3c-onyx"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24009

[services.development]
run = "pnpm --filter @workspace/3c-onyx run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/3c-onyx", "run", "build" ]
publicDir = "artifacts/3c-onyx/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24009"
BASE_PATH = "/"
